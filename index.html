<style>
  html, body { margin: 0; height: 100%; background: var(--surface-subtle); color: var(--dv-ink); }
  #root { min-height: 100vh; }
  * { box-sizing: border-box; }
  button { font-family: var(--font-body); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cdd3d1; border-radius: 999px; border: 2px solid var(--surface-subtle); }
  @keyframes dvSpin { to { transform: rotate(360deg); } }
  @keyframes dvPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes dvToast { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes dvFade { from { transform: translateY(7px); } to { transform: translateY(0); } }
  @keyframes dvSlideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
  .dv-screen { animation: dvFade .28s var(--ease-out); }
  .dv-kpi { transition: transform .18s var(--ease-out), box-shadow .18s var(--ease-out); }
  .dv-kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); }
  .dv-kpi-go { opacity: 0; transition: opacity .15s; }
  .dv-kpi:hover .dv-kpi-go { opacity: 1; }
  @keyframes dvShimmer { 0% { background-position: -200px 0; } 100% { background-position: 200px 0; } }
  .dv-skel { background: linear-gradient(90deg, #EEF0EF 25%, #F7F8F8 50%, #EEF0EF 75%); background-size: 400px 100%; animation: dvShimmer 1.1s linear infinite; }
  input:focus, textarea:focus, select:focus { box-shadow: var(--focus-ring); border-color: var(--dv-green-bright) !important; }
  body.dv-no-tips span[style*="cursor: help"] { display: none !important; }
</style>
</head>
<body>

    <rect x="150" y="330" width="150" height="26" rx="9" fill="rgba(255,255,255,.25)"/>
    <circle cx="900" cy="300" r="92" fill="#FDB813"/>
    <path d="M858 268 h40 a30 30 0 0 1 0 60 h-40 z M858 268 v60 M922 268 v60 l28 60 l28 -60 v-60" fill="none" stroke="#00533F" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="730" y="470" font-family="Montserrat, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" text-anchor="middle">Cổng vận hành</text>

<script src="vendor/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel" src="src/pharmacy/Optimizer.jsx"></script>

<script type="text/babel">
  const TITLES = {
    dashboard: 'Tổng quan — Sức khỏe tồn kho', purchasing: 'Đề xuất mua hàng', transfers: 'Điều chuyển', inventory: 'Tồn kho chi nhánh',
    approvals: 'Chờ duyệt', rfq: 'Yêu cầu báo giá', suppliers: 'Nhà cung cấp', expiry: 'Cận hạn / FEFO',
    receiving: 'Nhận hàng', offers: 'Duyệt sản phẩm mới',
    connectors: 'Kết nối hệ thống', audit: 'Nhật ký hoạt động', settings: 'Cài đặt',
    'missing-supplier': 'SKU chưa có NCC', profile: 'Hồ sơ của tôi',
    products: 'Danh mục sản phẩm', network: 'Điểm bán & Mạng lưới', masterlists: 'Dữ liệu nền', users: 'Người dùng & phân quyền', promos: 'CTKM nhà cung cấp',
    'transfer-detail': 'Chi tiết phiếu điều chuyển',
  };

  /* DVP-514 — hai màn này dựng số từ kế hoạch đã tính, nên khi engine không tính lại được thì
     chúng vẫn hiện SỐ CŨ mà không báo gì. Trong code thật, `PlanStaleBanner` được ghép ở cấp
     TRANG (`app/(portal)/purchasing/page.tsx`, `…/transfers/page.tsx`); ở prototype, chỗ tương
     đương là router này — không phải bên trong từng màn. */
  const STALE_LABEL = { purchasing: 'Đề xuất mua hàng', transfers: 'Gợi ý điều chuyển' };

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "cardRadius": 18,
    "accent": "#FDB813",
    "pageBg": "#F1F1F1",
    "cardShadow": "soft",
    "showTips": true,
    "whActive": "1",
    "trfTicket": "TRF-202608-024"
  }/*EDITMODE-END*/;
  const SHADOWS = { subtle: '0 2px 8px rgba(0,51,40,0.07)', soft: '0 8px 24px rgba(0,51,40,0.10)', strong: '0 16px 40px rgba(0,51,40,0.16)' };

  function App() {
    const [t, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
    React.useEffect(() => {
      const r = document.documentElement.style;
      r.setProperty('--radius-card', t.cardRadius + 'px');
      r.setProperty('--dv-yellow', t.accent);
      r.setProperty('--accent', t.accent);
      r.setProperty('--surface-subtle', t.pageBg);
      r.setProperty('--shadow-card', SHADOWS[t.cardShadow] || SHADOWS.soft);
      document.body.classList.toggle('dv-no-tips', !t.showTips);
    }, [t]);
    const [authed, setAuthed] = React.useState(false);
    const [view, setView] = React.useState('dashboard');
    const isMobile = window.usePharmIsMobile();
    const [navOpen, setNavOpen] = React.useState(false);
    const [role, setRole] = React.useState('admin');
    const [syncing, setSyncing] = React.useState(false);
    const [syncOpen, setSyncOpen] = React.useState(false);
    const [lastSync, setLastSync] = React.useState('08:55 · 22-07');
    const [toast, setToast] = React.useState('');

    const doSync = () => { if (!syncing) setSyncOpen(true); };

    if (!authed) return <window.PharmaLogin onLogin={() => setAuthed(true)} />;

    /* [T35] `setLastSync` đi kèm: Cài đặt tự khai "đã tính lại" mà không với tới được mốc
       "Số liệu" trên thanh trên cùng, nên màn nói một đằng thanh trên cùng đứng yên. */
    const props = { setView, role, toast, setToast, lastSync, setLastSync, syncing, onSync: doSync };
    let content;
    if (view === 'dashboard') content = <window.PharmaDashboard {...props} />;
    else if (view === 'inventory') content = <window.InventoryScreen {...props} />;
    else if (view === 'purchasing') content = <window.PurchasingScreen {...props} />;
    else if (view === 'promos') content = <window.PromosScreen {...props} />;
    else if (view === 'transfers') content = <window.TransfersScreen {...props} />;
    /* DVP-552 — trang RIÊNG, không phải khối trong màn Điều chuyển. Trong code thật đây là
       `/transfers/[id]`; phần đáng chú ý của bản đó không nằm ở đây mà ở cổng phân quyền:
       route lồng KHÔNG thừa hưởng luật của route cha, phải giải khoá bằng `resolveRouteKey`. */
    else if (view === 'transfer-detail') content = <window.TransferDetailScreen {...props} ticketId={t.trfTicket} />;
    else if (view === 'approvals') content = <window.ApprovalsScreen {...props} />;
    else if (view === 'suppliers') content = <window.SuppliersScreen {...props} />;
    else if (view === 'expiry') content = <window.ExpiryScreen {...props} />;
    else if (view === 'rfq') content = <window.RFQScreen {...props} />;
    else if (view === 'receiving') content = <window.ReceivingScreen {...props} />;
    else if (view === 'offers') content = <window.SuppliersScreen {...props} initialTab="offers" />;
    else if (view === 'connectors') content = <window.ConnectorsScreen {...props} />;
    else if (view === 'settings') content = <window.SettingsScreen {...props} />;
    else if (view === 'products') content = <window.ProductMaster {...props} />;
    else if (view === 'network') content = <window.StoresNetwork {...props} />;
    else if (view === 'masterlists') content = <window.MasterListsScreen {...props} />;
    else if (view === 'users') content = <window.UsersScreen {...props} />;
    else if (view === 'audit') content = <window.AuditScreen {...props} />;
    else if (view === 'missing-supplier') content = <window.MissingSupplierScreen {...props} />;
    else if (view === 'profile') content = <window.ProfileScreen {...props} />;

    /* Số kho tổng đang hoạt động. Trong sản phẩm thật: `countActiveWarehouses(loadBranches(…))`,
       đổi khi người dùng bấm ở Điểm bán & Mạng lưới › cột Loại. Ở prototype lấy từ bảng chỉnh
       để người duyệt thiết kế lật được cả ba trạng thái mà không cần dữ liệu thật. */
    const whActive = Number(t.whActive != null ? t.whActive : 1);

    return (
      <div style={{ display: 'flex', minHeight: '100vh' }}>
        <window.PharmaSidebar view={view} setView={setView} role={role} mobile={isMobile} open={navOpen} onClose={() => setNavOpen(false)} />
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
          <window.PharmaTopbar title={TITLES[view]} role={role} setRole={setRole} syncing={syncing} lastSync={lastSync} setView={setView} mobile={isMobile} onMenu={() => setNavOpen(true)} onLogout={() => { setAuthed(false); setView('dashboard'); }} />
          <main className="dv-screen" key={view} style={{ flex: 1 }}>
            {STALE_LABEL[view] && (
              <div style={{ padding: '24px 28px 0', maxWidth: 1240, margin: '0 auto' }}>
                <window.PlanStaleBanner activeWarehouses={whActive} what={STALE_LABEL[view]} />
              </div>
            )}
            {content}
          </main>
        </div>
        <window.Toast msg={toast} onDone={() => setToast('')} />
        <window.SyncDrawer open={syncOpen} onStart={() => setSyncing(true)} onDone={(ts) => { setSyncing(false); setLastSync(ts); setToast('Đồng bộ hoàn tất — đã tính lại đề xuất mua & điều chuyển.'); }} onClose={() => setSyncOpen(false)} />
        <window.TweaksPanel>
          <window.TweakSection label="Hình khối" />
          <window.TweakSlider label="Bo góc thẻ" value={t.cardRadius} min={8} max={28} step={2} unit="px" onChange={(v) => setTweak('cardRadius', v)} />
          <window.TweakRadio label="Đổ bóng thẻ" value={t.cardShadow} options={['subtle', 'soft', 'strong']} onChange={(v) => setTweak('cardShadow', v)} />
          <window.TweakSection label="Màu sắc" />
          <window.TweakColor label="Sắc nhấn" value={t.accent} options={['#FDB813', '#F5A623', '#E1A100']} onChange={(v) => setTweak('accent', v)} />
          <window.TweakColor label="Nền trang" value={t.pageBg} options={['#F1F1F1', '#FFFFFF', '#EAF5F1']} onChange={(v) => setTweak('pageBg', v)} />
          <window.TweakSection label="Nội dung" />
          <window.TweakToggle label="Hiện gợi ý thuật ngữ" value={t.showTips} onChange={(v) => setTweak('showTips', v)} />
          <window.TweakSection label="Kịch bản" />
          <window.TweakRadio label="Số kho tổng hoạt động" value={String(t.whActive != null ? t.whActive : 1)} options={['0', '1', '2']} onChange={(v) => setTweak('whActive', v)} />
          {/* Chọn phiếu là ĐI LUÔN sang trang chi tiết — nếu chỉ đổi biến mà không điều hướng thì
              người duyệt thiết kế không có đường nào tới màn đó (sidebar cố ý không có mục này,
              y như sản phẩm thật: vào bằng cách bấm mã phiếu ở danh sách). Nút "← Về danh sách"
              trong màn gọi setView('transfers') nên đường quay lại vẫn nguyên. */}
          <window.TweakRadio label="Mở phiếu điều chuyển" value={String(t.trfTicket || 'TRF-202608-024')} options={['TRF-202608-024', 'TRF-202608-025']} onChange={(v) => { setTweak('trfTicket', v); setView('transfer-detail'); }} />
        </window.TweaksPanel>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
